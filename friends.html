<!DOCTYPE html>
<html lang="en">
 <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title> Friends - Evolvia</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            bg: "#0a0e27",
                            card: "#141a35",
                            border: "#252c4a",
                        },
                         fontFamily: {
                            sans: ["Poppins", "sans-serif"],
                        },
                    },
                },
            };
            </script>
    </head>
    <body class="bg-bg text-white min-h-screen">

        <!--Top nav-->
        <nav class="flex items-center justify-between px-8 py-4 border-b border-border">
            <div class="flex items-center gap-8">
                <span class="font-bold text-lg">&lt;/&gt; Evolvia</span>
                <div class="hidden md:flex gap-6 text-sm text-gray-300">
                    <a href="dashboard.html" class="hover:text-white">Dashboard</a>
                    <a href="practice.html" class="hover:text-white">Practice</a>
                    <a href="friends.html" class="text-white font-medium">Friends</a>
                    <a href="profile.html" class="hover:text-white">Profile</a>
                    <a href="badges.html" class="hover:text-white">Badges</a>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <a href="about.html" class="text-sm text-gray-300 hover:text-white">About</a>
                <span class="text-sm text-gray-300">Login</span>
                <button class="bg-gradient-to-r from-purple-500 to-blue-500 text-sm font-medium px-4 py-2 rounded-lg">
                    Sign Up
                </button> 
            </div>
        </nav>
        <main class="max-w-4x1 mx-auto px-6 py-10">

            <div classes="flex items-center justify-between mb-6">
                <h1 class="text-2xl font-bold">My Friends</h1>
                <button class="bg-gradient-to-r from-purple-500 to-blue-500 text-sm font-medium px-4 py-2 rounded-lg">
                    Find Friends
                </button>
            </div>

            <input
                type="text"
                placeholder="search friends..."
                class="w-full bg-card border border-border rounded-lg px-4 py-2 text-sm mb-8 placeholder-gray-500 focus:outline-none focus;border-purple-500"
            />

            <div class="space-y-3">

                <!--Friend row-->
           <div class="flex items-center justify-between bg-card border border-border rounded-xl px-5 py-4">
                <div class="flex items-center gap-4">
                    <div class="=relative">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-500 to-purple-500 flex items-center justify-center font-bold">T</div>
                        <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-400 border-2 border-card"></span>
                    </div>
                    <div>
                        <p class="font-semibold text-sm">Triple_T</p>
                        <p class="text-xs text-orange-400">Level 6 · 767 XP</p>
                    </div>
                </div>
                <button class="text-sm text-purple-400 hover:text-purple-300 font-medium">Message</button>
            </div>

            <div class="flex items-center justify-between bg-card border border-border rounded-xl px-5 py-4">
                <div class="flex items-center gap-4">
                    <div class="=relative">
                        <div class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-500 to-purple-500 flex items-center justify-center font-bold">A</div>
                        <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-400 border-2 border-card"></span>
                    </div>
                    <div>
                        <p class="font-semibold text-sm">Anurag</p>
                        <p class="text-xs text-gray-400">Level 5 · 860 XP</p>
                    </div>
                </div>
                <button class="text-sm text-purple-400 hover:text-purple-300 font-medium">Message</button>
            </div>

            <div class="flex items-center justify-between bg-card border border-border rounded-xl px-5 py-4">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center font-bold">B</div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-gray-500 border-2 border-card"></span>
                </div>
                <div>
                    <p class="font-semibold text-sm">Bhavishya</p>
                    <p class="text-xs text-gray-400">Level 2 · 121 XP</p>
                </div>
            </div>
            <div class="text-right">
                <p class="text-xs text-gray-500-mb-1">Offline</p>
                <button class="text-sm text-purple-400 hover:text-purple-300 font-medium">Message</button>
            </div>
        </div>
        
        <div class="flex items-center justify-between bg-card border border-border rounded-xl px-5 py-4">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-green-400 to-blue-500 flex items-center justify-center font-bold">A</div>
                    <span class="absolute bottom-0 right-0 w-3 h-3 rounded-full bg-green-400 border-2 border-card"></span>
                </div>
                <div>
                    <p class="font-semibold text-sm">Amit</p>
                    <p class="text-xs text-gray-400">Level 8 · 1200 XP</p>
                </div>
                </div>
                <button class="text-sm text-purple-400 hover:text-purple-300 font-medium">Messages</button>
            </div>
        
        </div>
    
    </main>

</body>
</html>
